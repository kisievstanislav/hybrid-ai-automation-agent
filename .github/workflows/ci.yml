name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    env:
      NODE_ENV: test
      AI_PROVIDER: mock
      DATABASE_URL: file:./ci.db
      APP_BASE_URL: http://127.0.0.1:3001
      API_BASE_URL: http://127.0.0.1:3001

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Apply Prisma migrations
        run: npx prisma migrate deploy

      - name: Seed test database
        run: npx prisma db seed

      - name: Run ESLint
        run: npm run lint

      - name: Run TypeScript typecheck
        run: npm run typecheck

      - name: Run unit and API integration tests
        run: npm run test:run -- --exclude tests/integration/queue/queueWorker.test.ts

      - name: Prepare QueueWorker test database
        env:
          DATABASE_URL: file:./queue-worker-ci.db
        run: npx prisma migrate deploy

      - name: Run QueueWorker integration tests
        env:
          DATABASE_URL: file:./queue-worker-ci.db
        run: npx vitest run tests/integration/queue/queueWorker.test.ts

      - name: Build application
        run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright UI tests
        run: npm run test:ui  